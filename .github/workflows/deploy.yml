name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so "最近修改" can use each file's last git commit time
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 类型检查（jsconfig.json 的 checkJs）——源码里本来就有大量 JSDoc，等于白捡
      - name: Typecheck
        run: npm run typecheck

      # 必须在 build 之前：build 会把生成物刷新，之后就永远"一致"了，
      # 这一步要抓的是「只加了 .md、忘了重新生成就提交」的漂移
      - name: Check generated files are in sync
        run: npm run check:generated

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
